<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>일본어 회화 트레이닝</title>
    <style>
        :root {
            --primary-color: #ff5722;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 600px;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
            color: #2c3e50;
            text-align: center;
        }

        .stats {
            text-align: center;
            font-size: 0.9rem;
            color: #7f8c8d;
            margin-bottom: 25px;
        }

        .quiz-box {
            margin-bottom: 20px;
        }

        .label {
            font-size: 0.85rem;
            font-weight: bold;
            color: #95a5a6;
            text-transform: uppercase;
            margin-bottom: 8px;
            display: block;
        }

        .korean-sentence {
            font-size: 1.3rem;
            font-weight: 600;
            background-color: #fdfefe;
            border-left: 4px solid var(--primary-color);
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.02);
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            font-size: 1.1rem;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            box-sizing: border-box;
            transition: border-color 0.3s;
            margin-bottom: 15px;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #e64a19;
        }

        .result-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            display: none;
        }

        .result-box.correct {
            background-color: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #c8e6c9;
        }

        .result-box.incorrect {
            background-color: #ffebee;
            color: #c62828;
            border: 1px solid #ffcdd2;
        }

        .feedback-title {
            font-weight: bold;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>일본어 회화 트레이닝</h1>
        <div class="stats" id="stats">맞춘 문제: 0 / 시도한 문제: 0</div>

        <div class="quiz-box">
            <span class="label">다음 한국어 문장을 일본어로 번역하세요</span>
            <div class="korean-sentence" id="koreanSentence">문장을 불러오는 중...</div>
            
            <input type="text" id="userInput" placeholder="여기에 일본어를 입력하세요 (예: すみません...)" autofocus>
            <button id="submitBtn" onclick="checkAnswer()">제출하기</button>
        </div>

        <div class="result-box" id="resultBox">
            <div class="feedback-title" id="feedbackTitle"></div>
            <div id="feedbackContent"></div>
        </div>
    </div>

    <script>
        // 회화 문장 데이터베이스 (원하시는 만큼 추가 가능합니다)
        const sentences = [
            {
                kr: "실례합니다. 메뉴 좀 주세요.",
                answers: ["すみません、메뉴를 주세요", "すみません、メニューをください", "すいません、メニューをください", "すみません、メニューお願いします"],
                keyword: "メニュー",
                tip: "메뉴를 달라고 할 때는 'メニューをください'가 가장 자연스럽습니다."
            },
            {
                kr: "이것은 얼마입니까?",
                answers: ["これはいくらですか", "これいくらですか", "これはいくらですか？"],
                keyword: "いくら",
                tip: "간단하게 'これ、いくら？'라고 반말로 물어볼 수도 있습니다."
            },
            {
                kr: "정말 감사합니다.",
                answers: ["どうもありがとうございます", "本当にありがとうございます", "ありがとうございます", "どうもありがとうございました"],
                keyword: "ありがとう",
                tip: "상황에 따라 'どうも'만 가볍게 쓰기도 합니다."
            },
            {
                kr: "지금 몇 시예요?",
                answers: ["いま何時ですか", "今何時ですか", "いまなんじですか"],
                keyword: "何時",
                tip: "시간을 물어볼 때는 '今(いま)'를 붙여주면 명확합니다."
            },
            {
                kr: "화장실이 어디에 있습니까?",
                answers: ["トイレはどこですか", "お手洗いどこですか", "お手洗いはどこですか", "トイレどこですか"],
                keyword: "トイレ",
                tip: "조금 더 공공장소나 격식을 차린 곳에서는 'おてあらい(お手洗い)'가 좋습니다."
            },
            {
                kr: "다시 한 번 말씀해 주세요.",
                answers: ["もう一度お願いします", "もういちどおねがいします", "もう一度言ってください"],
                keyword: "もう一度",
                tip: "못 알아들었을 때 'もう一度(いちど)お願いします'라고 하면 유용합니다."
            },
            {
                kr: "내일 봐요.",
                answers: ["また明日", "またあした", "また明日ね", "それではまた明日"],
                keyword: "明日",
                tip: "헤어질 때 가볍게 'じゃ、また明日！'라고 하면 친근합니다."
            }
        ];

        let currentIndex = 0;
        let correctCount = 0;
        let totalCount = 0;

        function loadNewQuestion() {
            // 무작위로 문장 선택
            currentIndex = Math.floor(Math.random() * sentences.length);
            document.getElementById("koreanSentence").innerText = sentences[currentIndex].kr;
            document.getElementById("userInput").value = "";
            document.getElementById("resultBox").style.display = "none";
            document.getElementById("userInput").focus();
        }

        function checkAnswer() {
            const userText = document.getElementById("userInput").value.trim();
            if (!userText) {
                alert("답안을 입력해주세요!");
                return;
            }

            totalCount++;
            const currentData = sentences[currentIndex];
            
            // 공백 및 문장 부호 제거 후 비교용 문자열 생성
            const cleanUserText = userText.replace(/[\s！？?.,]/g, "");
            
            // 정확한 일치 확인 또는 핵심 키워드 포함 여부 확인
            let isCorrect = false;
            let isNatural = true;

            // 등록된 정답들 중 하나와 일치하는지 확인
            for (let ans of currentData.answers) {
                const cleanAns = ans.replace(/[\s！？?.,]/g, "");
                if (cleanUserText === cleanAns) {
                    isCorrect = true;
                    break;
                }
            }

            // 완전 일치는 아니지만 핵심 키워드가 들어가 있고 의미가 통하는 경우 유연하게 정답 처리
            if (!isCorrect && cleanUserText.includes(currentData.keyword)) {
                isCorrect = true;
                isNatural = false; // 의미는 통하지만 어색할 수 있음
            }

            const resultBox = document.getElementById("resultBox");
            const feedbackTitle = document.getElementById("feedbackTitle");
            const feedbackContent = document.getElementById("feedbackContent");

            resultBox.style.display = "block";

            if (isCorrect) {
                correctCount++;
                if (isNatural) {
                    feedbackTitle.innerText = "정답입니다! 🎉";
                    feedbackContent.innerHTML = `완벽한 표현입니다. 원어민들이 자주 쓰는 자연스러운 문장이에요!`;
                } else {
                    feedbackTitle.innerText = "정답 처리되었습니다! 👍 (조금 어색한 부분 있음)";
                    feedbackContent.innerHTML = `의미는 통하지만 다음과 같이 표현하면 더 자연스러워요:<br><strong>추천 표현:</strong> ${currentData.answers[0]}<br><small>💡 ${currentData.tip}</small>`;
                }
                resultBox.className = "result-box correct";
                
                // 2초 후 자동으로 다음 문제로 넘어가기
                setTimeout(loadNewQuestion, 3000);
            } else {
                feedbackTitle.innerText = "틀렸습니다 🥲";
                feedbackContent.innerHTML = `다시 시도해 보세요!<br><strong>모범 답안:</strong> ${currentData.answers[0]}<br><small>💡 ${currentData.tip}</small>`;
                resultBox.className = "result-box incorrect";
            }

            updateStats();
        }

        function updateStats() {
            document.getElementById("stats").innerText = `맞춘 문제: ${correctCount} / 시도한 문제: ${totalCount}`;
        }

        // 엔터키 입력 시 제출 기능 연동
        document.getElementById("userInput").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                checkAnswer();
            }
        });

        // 페이지 로드 시 첫 문제 불러오기
        window.onload = loadNewQuestion;
    </script>
</body>
</html>
